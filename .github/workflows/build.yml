name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          cat > build.sh <<'SCRIPT'
          set -e
          echo "Installed platforms:"; ls /opt/android-sdk-linux/platforms
          V=$(ls /opt/android-sdk-linux/platforms | sed 's/android-//' | sort -n | tail -1)
          echo "Using android $V"
          sed -i "s/^android_version = .*/android_version = $V/" Cargo.toml
          cargo quad-apk build --release
          SCRIPT
          docker run --rm -v "$(pwd)":/root/src -w /root/src notfl3/cargo-apk sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hoi-clone-apk
          path: target/android-artifacts/release/apk/*.apk
